<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1220" />
    <!-- Without this, Chrome for Android doesn't know the page already provides its
         own correct light/dark styling (see the theme toggle + CSS vars in
         src/index.css) and applies its own automatic per-element "Force Dark"
         recoloring heuristic on top of ours. That heuristic is a known source of
         inconsistent, scroll/repaint-triggered color artifacts on complex pages —
         matches the reported "whole page turns green/purple during scene
         transitions, happens on most Android phones but not every time" exactly.
         This opts the page out of it entirely. -->
    <meta name="color-scheme" content="dark light" />
    <title>Loopare — Keep It Moving</title>
    <meta name="description" content="Loopare is India's premium circular marketplace — buy, sell, rent, barter, and trade services. Walk through Loopare World." />
    <link rel="icon" href="/assets/logo.png" type="image/png" />
    <!-- Inline, render-blocking-safe: guarantees the background is never plain white
         before the real stylesheet finishes loading, on a slow mobile connection.
         Matches src/index.css's dark-theme default; the stylesheet takes over once
         it arrives. -->
    <style>html,body{background:#0E1116;margin:0;padding:0}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
